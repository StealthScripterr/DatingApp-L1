@if (isOpen) {
<div class="fixed inset-0 z-60 flex items-center justify-center bg-slate-950/45 p-4 backdrop-blur-md">
    <div
        class="relative w-full max-w-md overflow-hidden rounded-4xl border border-violet-100 bg-white/90 shadow-[0_30px_80px_rgba(90,68,130,0.25)]">
        <button type="button"
            class="cursor-pointer absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-lg font-bold text-slate-500 transition hover:bg-slate-200 hover:text-slate-700"
            aria-label="Close login modal" (click)="closeLoginModal()">
            ×
        </button>

        <div class="bg-linear-to-r from-amber-200 via-pink-200 to-violet-200 p-6 text-center">
            <div
                class="mx-auto flex h-16 w-16 items-center justify-center overflow-hidden rounded-3xl bg-white/70 shadow-md shadow-pink-200/50">
                <img src="/beagle.gif" alt="FetchMate mascot" class="block h-full w-full object-cover" />
            </div>
            <p class="mt-4 text-xs font-black uppercase tracking-[0.2em] text-accent">Welcome back</p>
            <h2 class="mt-2 text-3xl font-black tracking-tighter text-slate-900">Fetch your match</h2>
        </div>

        <form #loginForm="ngForm" (ngSubmit)="login()" class="space-y-4 p-6">
            <label class="form-control w-full">
                <span class="mb-2 text-sm font-bold text-slate-600">Email address</span>
                <input [(ngModel)]="creds.email" name="email" type="email" placeholder="you@fetchmate.com"
                    class="input input-bordered input-primary w-full rounded-2xl border-violet-200 bg-violet-50/50 text-slate-700 placeholder:text-slate-400" />
            </label>

            <label class="form-control w-full">
                <span class="mb-2 text-sm font-bold text-slate-600">Password</span>
                <input [(ngModel)]="creds.password" name="password" type="password" placeholder="••••••••"
                    class="input input-bordered input-primary w-full rounded-2xl border-violet-200 bg-violet-50/50 text-slate-700 placeholder:text-slate-400" />
            </label>

            <div class="mt-2 flex items-center justify-between text-sm text-slate-500">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
                    Remember me
                </label>
                <a href="#" class="cursor-pointer font-bold text-accent hover:text-violet-900">Forgot password?</a>
            </div>

            <button type="submit"
                class="btn btn-primary w-full cursor-pointer rounded-full border-0 px-5 py-3 text-base font-extrabold shadow-[0_16px_36px_rgba(236,118,164,0.35)]">
                Fetch me in
            </button>

            <div class="text-center text-sm text-slate-500">
                New to FetchMate?
                <button type="button" class="cursor-pointer font-bold text-accent hover:text-violet-900"
                    (click)="openRegisterModal()">Create account</button>
            </div>
        </form>
    </div>
</div>
}
